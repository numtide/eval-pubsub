[package]
name = "pubsub-client"
version = "0.1.0"
edition = "2024"

[dependencies]
pubsub-proto = { path = "../pubsub-proto" }
pubsub-nar-copy = { path = "../pubsub-nar-copy" }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tokio = "*"
tonic = "*"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = { version = "*", features = ["io", "io-util"] }
log = "0.4"
