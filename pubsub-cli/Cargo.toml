[package]
name = "pubsub-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
pubsub-client = { path = "../pubsub-client" }
tokio = "*"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0" }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
