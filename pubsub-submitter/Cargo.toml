[package]
name = "pubsub-submitter"
version = "0.1.0"
edition = "2024"

[dependencies]
pubsub-proto = { path = "../pubsub-proto" }
tokio = "*"
tokio-stream = "*"
tonic = "*"
anyhow = "1.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-stream = { version = "0.1.8", features = ["net"] }
tower = { version = "0.4", features = ["util"] }
hyper-util = "*"
tempfile = "3.3.0"
