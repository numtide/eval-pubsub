[package]
name = "pubsub-submitter"
version = "0.1.0"
edition = "2024"

[dependencies]
pubsub-proto = { path = "../pubsub-proto" }
tokio = "*"
tokio-stream = "*"
tonic = "*"
thiserror = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
diesel = { version = "2.2.0", features = ["postgres", "uuid"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }
diesel_migrations = { version = "2.3.2" }
tokio-postgres = { version = "0.7" }
itertools = { version = "0.15" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio-stream = { version = "0.1.8", features = ["net"] }
tower = { version = "0.4", features = ["util"] }
hyper-util = "*"
tempfile = "3.3.0"
http = { version = "1.5" }
axum-core = "0.5"
