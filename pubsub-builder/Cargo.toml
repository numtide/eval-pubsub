[package]
name = "pubsub-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
pubsub-proto = { path = "../pubsub-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
tokio-stream = "*"
tonic = "*"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.40"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
