syntax = "proto3";

package pubsub;

service PubSub {
  rpc ListJobs(ListJobsRequest) returns (stream ListJobsResponse) {}
  rpc PickJob(PickJobRequest) returns (PickJobResponse) {}
  rpc ConcludeJob(ConcludeJobRequest) returns (ConcludeJobResponse) {}
  rpc JobOutput(JobOutputRequest) returns (JobOutputResponse) {}
}

message ListJobsRequest {
  BuilderInformation builder_information = 1;
}

message ListJobsResponse {
  Job job = 2;
}

message JobOutputRequest {
  UUID job_id = 1;
  repeated string output = 2;
}

message JobOutputResponse {

}

message PickJobRequest {
  UUID job_id = 1;
}

message PickJobResponse {
  message Allow {

  }

  message Deny {

  }

  oneof pick_response {
    Allow allow = 1;
    Deny deny = 2;
  }
}

message ConcludeJobRequest {
  message Success {

  }

  message Failure {

  }

  UUID job_id = 1;
  oneof result {
    Success success = 2;
    Failure failure = 3;
  }
}

message ConcludeJobResponse {

}

message BuildJob {
  string derivation = 1;
}

message EvalJob {
  message Flake {
    string flake_ref = 1;
    repeated string attr = 2;
  }

  oneof type {
    Flake flake = 1;
  }
}

message BuilderInformation {
  string system = 1;
  int32 smt_core_count = 2;
  uint64 total_memory = 3;
}

message Job {
  UUID job_id = 1;
  oneof type {
    EvalJob eval = 2;
    BuildJob build = 3;
  }
}

message UUID {
  fixed64 hi = 1;
  fixed64 lo = 2;
}
