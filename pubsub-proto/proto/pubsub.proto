syntax = "proto3";

package pubsub;

service PubSub {
  rpc ListJobs(BuilderInformation) returns (stream Job) {}
  rpc PickJob(Job) returns (PickJobResponse) {}
  rpc ConcludeJob(ConcludeJobRequest) returns (ConcludeJobResponse) {}
}

message PickJobResponse {
  message Allow {
    uint64 job_id = 1;
  }

  message Deny {

  }

  oneof pick_response {
    Allow allow = 1;
    Deny deny = 2;
  }
}

message ConcludeJobRequest {
  message Success {

  }

  message Failure {

  }

  uint64 job_id = 1;
  oneof result {
    Success success = 2;
    Failure failure = 3;
  }
}

message ConcludeJobResponse {

}

message BuildJob {
  string derivation = 1;
}

message EvalJob {
  message Flake {
    string flake_ref = 1;
    repeated string attr = 2;
  }

  oneof type {
    Flake flake = 1;
  }
}

message BuilderInformation {
  string system = 1;
  int32 smt_core_count = 2;
  uint64 total_memory = 3;
}

message Job {
  oneof type {
    EvalJob eval = 1;
    BuildJob build = 2;
  }
}
