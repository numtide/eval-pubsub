syntax = "proto3";

package pubsub.common;

import "google/protobuf/timestamp.proto";

message BuildJob {
  string derivation = 1;
}

message EvalJob {
  message Flake {
    string flake_ref = 1;
    repeated string attrs = 2;
  }

  oneof type {
    Flake flake = 1;
  }
}

message AnonymousJob {
  oneof type {
    EvalJob eval = 1;
    BuildJob build = 2;
  }
}

message Job {
  UUID job_id = 1;
  AnonymousJob anonymous_job = 2;
}

message JobWithStatus {
  Job job = 1;
  JobStatus status = 2;
}

message UUID {
  fixed64 hi = 1;
  fixed64 lo = 2;
}

message BuilderInformation {
  UUID uuid = 1;
  string system = 2;
  int32 smt_core_count = 3;
  uint64 total_memory = 4;
  string store_uri = 5;
}

message Builder {
  BuilderInformation information = 1;
  bool active = 2;
}

message EvalResult {
  message Derivation {
    string drv_path = 1;
    string system = 2;
    map<string, string> outputs = 3;
    repeated string required_system_features = 4;
    string store_dir = 5;
  }

  message Failed {

  }

  message Attr {
    repeated string attr_path = 1;
    oneof result {
      Derivation derivation = 2;
      Failed failed = 3;
    }
  }

  repeated Attr attrs = 1;
}



message JobStatus {
  message Pending {

  }
  message Picked {

  }
  message Concluded {
    message Success {
      UUID builder_uuid = 1;
    }
    message Failure {
      UUID builder_uuid = 1;
    }
    oneof conclusion {
      Success success = 1;
      Failure failure = 2;
    }
  }

  oneof status {
    Pending pending = 1;
    Picked picked = 2;
    Concluded concluded = 3;
  }
}

message JobOutput {
  message AttrPath {
    repeated string attr_path = 1;
  }

  string line = 1;
  google.protobuf.Timestamp time = 2;
  AttrPath attr_path = 3;
}
