syntax = "proto3";

package pubsub.server;

import "common.proto";

service PubSub {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc ListJobs(ListJobsRequest) returns (stream ListJobsResponse) {}
  rpc PickJob(PickJobRequest) returns (PickJobResponse) {}
  rpc ConcludeJob(ConcludeJobRequest) returns (ConcludeJobResponse) {}
  rpc JobOutput(JobOutputRequest) returns (JobOutputResponse) {}
}

message RegisterRequest {
  common.BuilderInformation builder_information = 1;
}

message RegisterResponse {

}

message ListJobsRequest {

}

message ListJobsResponse {
  common.Job job = 2;
}

message JobOutputRequest {
  common.UUID job_id = 1;
  repeated string output = 2;
}

message JobOutputResponse {

}

message PickJobRequest {
  common.UUID job_id = 1;
}

message PickJobResponse {
  message Allow {

  }

  message Deny {

  }

  oneof pick_response {
    Allow allow = 1;
    Deny deny = 2;
  }
}

message ConcludeJobRequest {
  message Success {

  }
  message Failure {

  }

  common.UUID job_id = 1;
  oneof job_status {
    Success success = 2;
    Failure failure = 3;
  }
  oneof result {
    common.EvalResult eval = 4;
  }
}

message ConcludeJobResponse {

}
