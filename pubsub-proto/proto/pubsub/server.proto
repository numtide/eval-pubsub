syntax = "proto3";

package pubsub.server;

import "common.proto";

service PubSub {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc ListJobs(ListJobsRequest) returns (stream ListJobsResponse) {}
  rpc PickJob(PickJobRequest) returns (PickJobResponse) {}
  rpc ConcludeJob(ConcludeJobRequest) returns (ConcludeJobResponse) {}
  rpc JobOutput(JobOutputRequest) returns (JobOutputResponse) {}
}

message RegisterRequest {
  BuilderInformation builder_information = 1;
}

message RegisterResponse {

}

message ListJobsRequest {

}

message ListJobsResponse {
  Job job = 2;
}

message JobOutputRequest {
  common.UUID job_id = 1;
  repeated string output = 2;
}

message JobOutputResponse {

}

message PickJobRequest {
  common.UUID job_id = 1;
}

message PickJobResponse {
  message Allow {

  }

  message Deny {

  }

  oneof pick_response {
    Allow allow = 1;
    Deny deny = 2;
  }
}

message ConcludeJobRequest {
  common.UUID job_id = 1;
}

message ConcludeJobResponse {

}

message BuilderInformation {
  common.UUID uuid = 1;
  string system = 2;
  int32 smt_core_count = 3;
  uint64 total_memory = 4;
}

message Job {
  common.UUID job_id = 1;
  oneof type {
    common.EvalJob eval = 2;
    common.BuildJob build = 3;
  }
}
