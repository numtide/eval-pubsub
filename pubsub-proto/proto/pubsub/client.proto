syntax = "proto3";

package pubsub.client;

import "common.proto";

service PubSubClient {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse) {}
  rpc TailJob(TailJobRequest) returns (stream TailJobResponse) {}
  rpc WaitJob(WaitJobRequest) returns (stream WaitJobResponse) {}
  rpc GetJobs(GetJobsRequest) returns (GetJobsResponse) {}

  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {}
  rpc ListBuilders(ListBuildersRequest) returns (ListBuildersResponse) {}
}

message SubmitJobRequest {
  common.AnonymousJob job = 1;
}

message SubmitJobResponse {
  common.UUID job_id = 1;
}

message TailJobRequest {
  common.UUID job_id = 1;
  bool follow = 2;
  bool end = 3;
  int64 number = 4;
}

message TailJobResponse {
  string line = 1;
}

message WaitJobRequest {
  common.UUID job_id = 1;
}

message WaitJobResponse {
  common.JobStatus.Concluded job_status = 2;
}

// TODO not how one does pagination, how does one do it?
message ListJobsRequest {
  message FilterPending {}
  message FilterPicked {}
  message FilterFailed {}
  message FilterSucceeded {}

  int32 page = 1;
  int32 count = 2;
  oneof filter {
    FilterPending pending = 3;
    FilterPicked picked = 4;
    FilterFailed failed = 5;
    FilterSucceeded succeeded = 6;
  };
}

message ListJobsResponse {
  repeated common.JobWithStatus jobs = 1;
  int32 total = 2;
}

message ListBuildersRequest {
  int32 page = 1;
  int32 count = 2;
}

message ListBuildersResponse {
  repeated common.Builder builders = 1;
  int32 total = 2;
}


message GetJobsRequest {
  repeated common.UUID job_uuids = 1;
}

message GetJobsResponse {
  repeated common.JobWithStatus jobs = 1;
}
